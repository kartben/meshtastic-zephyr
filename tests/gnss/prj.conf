CONFIG_ZTEST=y

CONFIG_GNSS=y
CONFIG_GNSS_EMUL=y
CONFIG_GNSS_EMUL_MANUAL_UPDATE=y

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_DEVICE_METRICS=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n
CONFIG_MESHTASTIC_NODEDB=n
CONFIG_MESHTASTIC_NODEINFO=n
CONFIG_MESHTASTIC_MESSAGE=n
CONFIG_MESHTASTIC_MQTT=n
CONFIG_MESHTASTIC_RELIABLE=n

CONFIG_MESHTASTIC_GNSS=y
# Periodic broadcasts stay off so the only transmits are the ones a test asks for.
CONFIG_MESHTASTIC_GNSS_AUTO_SEND=n
# Short enough that a test can wait the reply window out.
CONFIG_MESHTASTIC_GNSS_REPLY_SUPPRESS_SEC=1

CONFIG_MESHTASTIC_NODE_ID_CUSTOM=y

CONFIG_MAIN_STACK_SIZE=4096
