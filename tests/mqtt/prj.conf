CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
# Logs go straight out the console instead of through the shell, which would
# reprint every line to redraw its prompt.
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_MESHTASTIC_LOG_LEVEL_INF=y
CONFIG_ASSERT=y

# Sockets are handed straight to the host, so the firmware opens a real TCP
# connection to the mosquitto broker the test starts. Nothing here needs a TAP
# interface or root on the host side.
CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_DNS_RESOLVER=y

# The gateway waits for a global IPv4 address before it dials the broker. This
# one is configured before main() runs, which is the case that used to leave it
# waiting forever.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=n

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_SHELL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_DEVICE_METRICS=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=n
CONFIG_MESHTASTIC_NODEDB=n
CONFIG_MESHTASTIC_NODEINFO=n
CONFIG_MESHTASTIC_MESSAGE=n
CONFIG_MESHTASTIC_RELIABLE=n

CONFIG_MESHTASTIC_MQTT=y
CONFIG_MESHTASTIC_MQTT_BROKER_HOST="127.0.0.1"
CONFIG_MESHTASTIC_MQTT_BROKER_PORT=11883
CONFIG_MESHTASTIC_MQTT_ROOT="msh/EU_868"
CONFIG_MESHTASTIC_MQTT_UPLINK_ENABLED=y
CONFIG_MESHTASTIC_MQTT_DOWNLINK_ENABLED=y
CONFIG_MESHTASTIC_MQTT_ENCRYPTION_ENABLED=y

CONFIG_MESHTASTIC_NODE_ID_CUSTOM=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
