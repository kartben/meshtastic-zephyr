CONFIG_ZTEST=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=2048
CONFIG_SHELL_CMD_BUFF_SIZE=512
# Keep command output out of the shell's own log stream.
CONFIG_LOG=n

CONFIG_MESHTASTIC=y
CONFIG_MESHTASTIC_SHELL=y
CONFIG_MESHTASTIC_SETTINGS=n
CONFIG_MESHTASTIC_BLE=n
CONFIG_MESHTASTIC_SERIAL=n
CONFIG_MESHTASTIC_GNSS=n
CONFIG_MESHTASTIC_MQTT=n
CONFIG_MESHTASTIC_RELIABLE=y

CONFIG_SENSOR=y
CONFIG_MESHTASTIC_NODEDB=y
CONFIG_MESHTASTIC_MESSAGE=y
CONFIG_MESHTASTIC_NODEINFO=y
CONFIG_MESHTASTIC_NODEINFO_AUTO_SEND=n
CONFIG_MESHTASTIC_DEVICE_METRICS=y
CONFIG_MESHTASTIC_DEVICE_METRICS_AUTO_SEND=n
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS=y
CONFIG_MESHTASTIC_ENVIRONMENT_METRICS_AUTO_SEND=n

CONFIG_MESHTASTIC_NODE_ID_CUSTOM=y

CONFIG_MAIN_STACK_SIZE=4096
