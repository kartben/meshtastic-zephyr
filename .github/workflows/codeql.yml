name: CodeQL

on:
  push:
    branches:
    - main
  pull_request:
  schedule:
    - cron: "34 16 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Workflow files, as upstream Zephyr does: catches things like shell
          # injection through untrusted GitHub context values.
          - language: actions
            build-mode: none
            config-file: ./meshtastic-zephyr/.github/codeql/codeql-actions-config.yml
            timeout: 20
          # The mesh stack itself. Upstream Zephyr leaves C/C++ out of its
          # own CodeQL run - building the whole tree under the tracer is not
          # tractable there - but this repository is one module, its builds are
          # already part of CI, and it parses packets straight off the air, so
          # the taint analysis is worth the build time.
          - language: c-cpp
            build-mode: manual
            config-file: ./meshtastic-zephyr/.github/codeql/codeql-c-cpp-config.yml
            timeout: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: meshtastic-zephyr
          persist-credentials: false

      - name: Set up Python
        if: matrix.build-mode == 'manual'
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        if: matrix.build-mode == 'manual'
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: meshtastic-zephyr
          toolchains: xtensa-espressif_esp32s3_zephyr-elf
          # CodeQL cannot observe a compilation that ccache serves from its
          # cache, so every build below is a cache miss by design.
          enable-ccache: false

      - name: Fetch Espressif binary blobs
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          # The T-Watch S3 Bluetooth and Wi-Fi builds link against Espressif's
          # closed-source libraries, and Zephyr verifies every blob a module
          # declares, not just the ones a given image needs.
          west blobs fetch hal_espressif

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ${{ matrix.config-file }}
          # The Zephyr workspace is checked out around the application, so the
          # repository is one directory below the workspace root.
          source-root: meshtastic-zephyr

      - name: Build
        if: matrix.build-mode == 'manual'
        working-directory: meshtastic-zephyr
        shell: bash
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: zephyr
        run: |
          # CodeQL only analyzes code it watches the compiler build. The ztest
          # suites cover the protocol core; the sample is built for the T-Watch
          # S3 because that is the platform whose configurations pull in
          # Bluetooth, the PhoneAPI, the shell, GNSS and the MQTT gateway - the
          # code paths that handle input from off the air and off the network.
          # USE_CCACHE=0 keeps every compilation visible to the tracer.
          west twister -T tests -p native_sim/native/64 \
            -O twister-out-tests --build-only -v --inline-logs -x=USE_CCACHE=0
          west twister -T samples/meshtastic -p twatch_s3/esp32s3/procpu \
            -O twister-out-sample --build-only -v --inline-logs -x=USE_CCACHE=0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          checkout_path: ${{ github.workspace }}/meshtastic-zephyr
          # A C/C++ database of a Zephyr build is multiple gigabytes and is
          # mostly upstream code; there is no point in shipping it anywhere.
          upload-database: false
