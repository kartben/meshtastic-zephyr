name: CodeQL

on:
  push:
    branches:
    - main
  pull_request:
  schedule:
    - cron: "34 16 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-actions:
    # Workflow files, as upstream Zephyr does: catches things like shell
    # injection through untrusted GitHub context values. This job checks out at
    # the workspace root, because the "actions" extractor resolves the config
    # path filters relative to the workspace rather than to the source root.
    name: Analyze (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-actions-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

  analyze-c-cpp:
    # The mesh stack itself. Upstream Zephyr leaves C/C++ out of its own CodeQL
    # run - building the whole tree under the tracer is not tractable there -
    # but this repository is one module, its builds are already part of CI, and
    # it parses packets straight off the air, so the taint analysis is worth
    # the build time. This job needs a west workspace around the application,
    # hence the checkout one directory below the workspace root.
    name: Analyze (c-cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: meshtastic-zephyr
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1.0.15
        with:
          app-path: meshtastic-zephyr
          toolchains: xtensa-espressif_esp32s3_zephyr-elf
          # CodeQL cannot observe a compilation that ccache serves from its
          # cache, so every build below is a cache miss by design.
          enable-ccache: false

      - name: Fetch Espressif binary blobs
        shell: bash
        run: |
          # The T-Watch S3 Bluetooth and Wi-Fi builds link against Espressif's
          # closed-source libraries, and Zephyr verifies every blob a module
          # declares, not just the ones a given image needs.
          west blobs fetch hal_espressif

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
          # Building the module necessarily compiles Zephyr and its west
          # modules as well; the source root is what keeps the database, and so
          # the results, to the code maintained here.
          source-root: meshtastic-zephyr

      - name: Build
        working-directory: meshtastic-zephyr
        shell: bash
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: zephyr
        run: |
          # CodeQL only analyzes code it watches the compiler build. The ztest
          # suites cover the protocol core; the sample is built for the T-Watch
          # S3 because that is the platform whose configurations pull in
          # Bluetooth, the PhoneAPI, the shell, GNSS and the MQTT gateway - the
          # code paths that handle input from off the air and off the network.
          # USE_CCACHE=0 keeps every compilation visible to the tracer.
          west twister -T tests -p native_sim/native/64 \
            -O twister-out-tests --build-only -v --inline-logs -x=USE_CCACHE=0
          west twister -T samples/meshtastic -p twatch_s3/esp32s3/procpu \
            -O twister-out-sample --build-only -v --inline-logs -x=USE_CCACHE=0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
          checkout_path: ${{ github.workspace }}/meshtastic-zephyr
          # A C/C++ database of a Zephyr build is multiple gigabytes and is
          # mostly upstream code; there is no point in shipping it anywhere.
          upload-database: false
