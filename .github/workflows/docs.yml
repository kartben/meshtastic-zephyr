name: Docs

on:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Doxygen docs
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event != 'pull_request' &&
       contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build docs
        run: doxygen Doxyfile

      - name: Download coverage report
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: protocol-coverage-html
          path: coverage-html
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download latest coverage report
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="$(gh run list --workflow=build.yml --branch=main --limit 10 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].databaseId')"
          if [ -n "${RUN_ID}" ]; then
            gh run download "${RUN_ID}" --name protocol-coverage-html --dir coverage-html
          fi

      - name: Include coverage report in site
        run: |
          if [ -f coverage-html/index.html ]; then
            mkdir -p docs/html/coverage
            cp -a coverage-html/. docs/html/coverage/
          fi

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy-docs:
    name: Publish docs
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: build-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
